version: "2"
run:
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: all
  disable:
    - containedctx
    - depguard
    - dogsled
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errname
    - errorlint
    - exhaustruct
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - ginkgolinter
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - godoclint
    - goheader
    - gomoddirectives
    - importas
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - mnd
    - musttag
    - nakedret
    - nestif
    - noinlineerr
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testableexamples
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 30
      package-average: 0
    errcheck:
      check-type-assertions: false
      check-blank: false
    gosec:
      excludes:
        - G110
        - G305
        - G115
      config:
        G306: "0755"
    interfacebloat:
      max: 12
    nlreturn:
      block-size: 2
    revive:
      severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # exhaustruct_v5: external types from tfprotov6, multierror, tar, cli, and github packages
      # don't need all fields set — they have many optional/future fields we intentionally omit.
      - linters: [exhaustruct_v5]
        text: "tfprotov6\\..*is missing"
      - linters: [exhaustruct_v5]
        text: "multierror\\.Error is missing"
      - linters: [exhaustruct_v5]
        text: "tar\\.Header is missing"
      - linters: [exhaustruct_v5]
        text: "cli\\.CLI is missing"
      - linters: [exhaustruct_v5]
        text: "github\\.RepositoryRelease is missing"
      - linters: [exhaustruct_v5]
        text: "publish\\.GithubReleaseCreateReq is missing"
      # exhaustruct_v5: resource.TestStep is an external type with many optional fields;
      # only the fields relevant to each test case are set.
      - linters: [exhaustruct_v5]
        text: "resource\\.TestStep is missing"
      # exhaustruct_v5: releases.Release is constructed via functional options; callers only
      # set the fields they need and the zero values for the rest are intentional.
      - linters: [exhaustruct_v5]
        path: "internal/releases/"
        text: "releases\\.Release is missing"
      # exhaustruct_v5: remoteflight types are zero-value starters populated via functional
      # options or immediately after construction — all missing fields are intentional.
      - linters: [exhaustruct_v5]
        path: "internal/remoteflight/"
        text: "is missing fields"
      # exhaustruct_v5: internal types used as zero-value starters where fields are set via
      # functional options or assigned immediately after construction.
      - linters: [exhaustruct_v5]
        path: "internal/server/"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "internal/transport/exec\\.go"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "internal/transport/test/"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "internal/ui/ui\\.go"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "internal/flightcontrol/"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "internal/remoteflight/hcl/"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "internal/kind/"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "tools/"
        text: "is missing fields"
      - linters: [exhaustruct_v5]
        path: "command/"
        text: "is missing fields"
      # modernize: errors.As with a local variable is idiomatic Go; the AsType suggestion
      # requires a Go version bump and changes call semantics in subtle ways.
      - linters: [modernize]
        text: "errorsastype:"
      # dupword: "hello\nhello\n" is a deliberate repeated value in a test assertion.
      - linters: [dupword]
        path: "internal/plugin/resource_local_exec_test\\.go"
      # staticcheck: UnsafeToUseLegacyTypeSystem is deprecated upstream but removing it
      # is a separate concern from this change.
      - linters: [staticcheck]
        text: "UnsafeToUseLegacyTypeSystem is deprecated"
      # unparam: transportReplacedAttributePaths always returns nil — known issue, not a bug.
      - linters: [unparam]
        text: "transportReplacedAttributePaths"
      # nolintlint: these directives were valid when added but the linter version changed.
      - linters: [nolintlint]
        path: "internal/plugin/(helpers_test|datasource_kubernetes_pods_test)\\.go"
issues:
  uniq-by-line: true
severity:
  default: error
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/hashicorp-forge
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
